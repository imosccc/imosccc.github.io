<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* 开场动画 */
  .splash-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 0.8s ease-out;
    cursor: pointer;
  }
  .splash-screen.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .splash-skull {
    font-size: 120px;
    margin-bottom: 30px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  .splash-text {
    font-size: 72px;
    font-weight: 900;
    color: #ff0000;
    letter-spacing: 20px;
    font-family: Arial, sans-serif;
    text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
  }
  .splash-welcome {
    font-size: 48px;
    font-weight: 700;
    color: #ff0000;
    letter-spacing: 15px;
    margin-top: 20px;
    font-family: "Noto Serif SC", "Source Han Serif CN", "STSong", serif;
    text-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.8; }
  }

  body {
    background: #ffffff;
    color: #2c4a3e;
    font-family: "Noto Serif SC", "Source Han Serif CN", "STSong", serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    max-width: 680px;
    width: 100%;
    padding: 60px 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  .name {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 36px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 48px;
    text-align: center;
  }
  .info-item {
    padding: 14px 8px;
    border: 1px solid #b7c9be;
    border-radius: 8px;
    transition: background .2s;
    cursor: default;
  }
  .info-item:hover { background: #f2f7f4; }
  .info-item a {
    color: #2c4a3e;
    text-decoration: none;
  }
  .info-item a:hover { text-decoration: underline; }
  .info-label {
    font-size: 0.72rem;
    opacity: 0.55;
    margin-bottom: 6px;
    letter-spacing: 0.08em;
  }
  .info-value {
    font-size: 0.88rem;
    font-weight: 500;
  }

  footer {
    width: 100%;
    text-align: center;
    padding: 28px 16px 0;
    border-top: 1px solid #dde7e0;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    line-height: 2.2;
  }
  #clock { font-variant-numeric: tabular-nums; }
  
  .badges {
    margin-bottom: 12px;
    display: inline-flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .badges a {
    display: inline-block;
  }
  .badges img {
    height: 20px;
    vertical-align: middle;
  }

  @media (max-width: 520px) {
    .name { font-size: 1.8rem; }
    .splash-skull { font-size: 80px; }
    .splash-text { font-size: 48px; letter-spacing: 12px; }
    .splash-welcome { font-size: 32px; letter-spacing: 10px; }
  }
</style>
</head>
<body>

<!-- 开场动画 -->
<div class="splash-screen" id="splashScreen">
  <div class="splash-skull">💀</div>
  <div class="splash-text">OSC</div>
  <div class="splash-welcome">欢迎光临</div>
</div>

<div class="container">

  <div class="name">王世朋</div>

  <div class="info-grid">
    <div class="info-item">
      <div class="info-label">个人博客</div>
      <div class="info-value">
        <a href="https://www.shimail.cn" target="_blank">前往博客 →</a>
      </div>
    </div>
    <div class="info-item">
      <div class="info-label">其他项目</div>
      <div class="info-value">
        <a href="https://www.wangshipeng.com" target="_blank">查看项目 →</a>
      </div>
    </div>
  </div>

</div>

<footer>
  <div class="badges">
    <a href="https://github.com" target="_blank">
      <img src="https://img.shields.io/badge/Source-Github-blue?logo=github" alt="Source-Github">
    </a>
    <img src="https://img.shields.io/badge/DNS-ENAME-red?logo=nextdns" alt="DNS-ENAME">
    <img src="https://img.shields.io/badge/DOMIAN-GNAME-brown?logo=webex" alt="DOMIAN-GNAME">
    <img src="https://img.shields.io/badge/AI-DeepSeek-blue?logo=deepseek" alt="AI-DeepSeek">
  </div>
  <div>本站已运行 <span id="runtime">0年 0天 0时 0分 0秒</span></div>
  <div>旅行者 1 号当前距离地球 <span id="voyager-distance">--</span> 千米，约为 <span id="voyager-au">--</span> 个天文单位（信号单程需 <span id="voyager-signal">--</span>）</div>
  <div>当前时间：<span id="clock">--</span></div>
  <div>© 2026 <a href="https://www.wangshipeng.com" target="_blank" style="color: inherit; text-decoration: none;">WSP</a> · All Rights Reserved</div>
</footer>

<script>
  // 开场动画控制
  var splashDismissed = false;
  
  function dismissSplash() {
    if (splashDismissed) return;
    splashDismissed = true;
    
    var splash = document.getElementById('splashScreen');
    splash.classList.add('fade-out');
    setTimeout(function() {
      splash.style.display = 'none';
    }, 800);
  }
  
  // 点击骷髅头跳过动画
  document.getElementById('splashScreen').addEventListener('click', dismissSplash);
  
  // 2.5秒后自动消失
  setTimeout(dismissSplash, 2500);
  
  function tick() {
    try {
      var now = new Date();
      var pad = function(n) { return String(n).padStart(2, '0'); };
      var clockEl = document.getElementById('clock');
      if (clockEl) {
        clockEl.textContent =
          now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' +
          pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      }
      
      var start = new Date(2022, 9, 1, 10, 10, 0);
      var years = now.getFullYear() - start.getFullYear();
      var months = now.getMonth() - start.getMonth();
      var days = now.getDate() - start.getDate();
      var hours = now.getHours() - start.getHours();
      var mins = now.getMinutes() - start.getMinutes();
      var secs = now.getSeconds() - start.getSeconds();
      
      if (secs < 0) { secs += 60; mins--; }
      if (mins < 0) { mins += 60; hours--; }
      if (hours < 0) { hours += 24; days--; }
      if (days < 0) {
        var prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += prevMonth.getDate();
        months--;
      }
      if (months < 0) { months += 12; years--; }
      
      var runtimeEl = document.getElementById('runtime');
      if (runtimeEl) {
        runtimeEl.textContent = years + '年 ' + pad(days) + '天 ' + pad(hours) + '时 ' + pad(mins) + '分 ' + pad(secs) + '秒';
      }
    } catch(e) { console.error('Clock error:', e); }
  }
