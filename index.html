<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    color: #2c4a3e;
    font-family: "Noto Serif SC", "Source Han Serif CN", "STSong", serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  /* ---- 左上角闹钟按钮 ---- */
  .alarm-toggle {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 48px;
    height: 48px;
    background: #f2f7f4;
    border: 2px solid #b7c9be;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.5rem;
    transition: all 0.3s;
    z-index: 1000;
  }
  .alarm-toggle:hover {
    background: #e8f0eb;
    transform: scale(1.1);
  }
  .alarm-toggle.active {
    background: #27ae60;
    border-color: #27ae60;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.4); }
    50% { box-shadow: 0 0 0 10px rgba(39, 174, 96, 0); }
  }

  /* ---- 右上角计算器按钮 ---- */
  .calc-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 48px;
    height: 48px;
    background: #f2f7f4;
    border: 2px solid #b7c9be;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 1.5rem;
    transition: all 0.3s;
    z-index: 1000;
  }
  .calc-toggle:hover {
    background: #e8f0eb;
    transform: scale(1.1);
  }

  /* ---- 弹窗通用样式 ---- */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  .modal.show {
    display: flex;
  }
  .modal-content {
    background: #ffffff;
    border-radius: 16px;
    padding: 24px;
    max-width: 400px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
  }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    background: #f2f7f4;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .modal-close:hover {
    background: #e8f0eb;
  }
  .modal-title {
    font-size: 1.2rem;
    font-weight: 600;
    margin-bottom: 20px;
    text-align: center;
  }

  /* ---- 闹钟弹窗 ---- */
  .alarm-input-group {
    margin-bottom: 16px;
  }
  .alarm-input-group label {
    display: block;
    font-size: 0.85rem;
    margin-bottom: 6px;
    opacity: 0.7;
  }
  .alarm-input-group input[type="time"] {
    width: 100%;
    padding: 10px;
    border: 1px solid #b7c9be;
    border-radius: 8px;
    font-size: 1rem;
    font-family: inherit;
  }
  .alarm-input-group input[type="file"] {
    width: 100%;
    padding: 8px;
    border: 1px solid #b7c9be;
    border-radius: 8px;
    font-size: 0.85rem;
  }
  .alarm-countdown {
    text-align: center;
    padding: 16px;
    background: #f2f7f4;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 0.9rem;
  }
  .alarm-countdown-time {
    font-size: 1.5rem;
    font-weight: 600;
    color: #2c4a3e;
    margin-top: 8px;
  }
  .alarm-buttons {
    display: flex;
    gap: 10px;
  }
  .alarm-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .alarm-btn-set {
    background: #27ae60;
    color: white;
  }
  .alarm-btn-set:hover {
    background: #229954;
  }
  .alarm-btn-cancel {
    background: #e74c3c;
    color: white;
  }
  .alarm-btn-cancel:hover {
    background: #c0392b;
  }

  /* ---- 计算器弹窗 ---- */
  .calc-display {
    background: #f2f7f4;
    border: 1px solid #b7c9be;
    border-radius: 8px;
    padding: 16px;
    font-size: 1.8rem;
    text-align: right;
    margin-bottom: 16px;
    min-height: 60px;
    word-break: break-all;
    font-family: "Courier New", monospace;
  }
  .calc-buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .calc-btn {
    padding: 16px;
    border: 1px solid #b7c9be;
    border-radius: 8px;
    background: #ffffff;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .calc-btn:hover {
    background: #f2f7f4;
  }
  .calc-btn:active {
    transform: scale(0.95);
  }
  .calc-btn-operator {
    background: #2c4a3e;
    color: white;
    border-color: #2c4a3e;
  }
  .calc-btn-operator:hover {
    background: #1a2e26;
  }
  .calc-btn-equals {
    background: #27ae60;
    color: white;
    border-color: #27ae60;
    grid-column: span 2;
  }
  .calc-btn-equals:hover {
    background: #229954;
  }
  .calc-btn-clear {
    background: #e74c3c;
    color: white;
    border-color: #e74c3c;
  }
  .calc-btn-clear:hover {
    background: #c0392b;
  }

  .container {
    max-width: 680px;
    width: 100%;
    padding: 60px 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  /* ---- 名字 ---- */
  .name {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 36px;
  }

  /* ---- 信息栏 ---- */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 48px;
    text-align: center;
  }
  .info-item {
    padding: 14px 8px;
    border: 1px solid #b7c9be;
    border-radius: 8px;
    transition: background .2s;
    cursor: default;
  }
  .info-item:hover { background: #f2f7f4; }
  .info-item a {
    color: #2c4a3e;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .info-item a:hover { text-decoration: underline; }
  .info-label {
    font-size: 0.72rem;
    opacity: 0.55;
    margin-bottom: 6px;
    letter-spacing: 0.08em;
  }
  .info-value {
    font-size: 0.88rem;
    font-weight: 500;
  }

  /* ---- 诗词区域 ---- */
  .poem-section {
    text-align: center;
    margin-bottom: 44px;
    line-height: 2;
  }
  .poem-title {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }
  .poem-body {
    font-size: 0.95rem;
    line-height: 2.1;
    letter-spacing: 0.06em;
  }

  /* ---- 署名 ---- */
  .signature {
    text-align: right;
    width: 100%;
    max-width: 560px;
    font-size: 1rem;
    letter-spacing: 0.1em;
    opacity: 0.7;
    margin-bottom: 48px;
  }

  /* ---- 徽章区域 ---- */
  .badges {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
  }

    dis
