<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSC</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    color: #2c4a3e;
    font-family: "Noto Serif SC", "Source Han Serif CN", "STSong", serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    max-width: 680px;
    width: 100%;
    padding: 60px 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  /* ---- 开场动画 ---- */
  .splash-screen {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    transition: opacity 0.8s ease;
    opacity: 1;
  }
  .splash-screen.fade-out {
    opacity: 0;
    pointer-events: none;
  }
  .splash-skull {
    font-size: 5rem;
    margin-bottom: 20px;
  }
  .splash-welcome {
    font-size: 2rem;
    color: #ff0000;
    font-weight: 700;
    letter-spacing: 0.2em;
    margin-bottom: 12px;
  }
  .splash-text {
    font-size: 2.4rem;
    color: #ff0000;
    font-weight: 700;
    letter-spacing: 0.15em;
  }

  /* ---- 名字区域 ---- */
  .name {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 36px;
    position: relative;
  }
  .name::after {
    content: "";
    display: block;
    width: 48px;
    height: 2px;
    background: #2c4a3e;
    margin: 14px auto 0;
    border-radius: 1px;
  }

  /* ---- 链接卡片 ---- */
  .link-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    width: 100%;
    margin-bottom: 48px;
  }
  .link-card {
    padding: 24px 16px;
    border: 1px solid #b7c9be;
    border-radius: 8px;
    text-align: center;
    transition: background .2s;
    cursor: pointer;
    text-decoration: none;
    color: #2c4a3e;
    display: block;
  }
  .link-card:hover { background: #f2f7f4; }
  .link-card-title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .link-card-url {
    font-size: 0.82rem;
    opacity: 0.6;
    word-break: break-all;
  }

  /* ---- 底部 ---- */
  footer {
    width: 100%;
    text-align: center;
    padding: 28px 16px 32px;
    border-top: 1px solid #dde7e0;
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    line-height: 1.8;
  }
  footer a {
    color: #2c4a3e;
    text-decoration: none;
  }
  footer a:hover { text-decoration: underline; }
  #clock { font-variant-numeric: tabular-nums; }
  .badges { margin-bottom: 10px; }
  .badges img { margin: 0 3px; vertical-align: middle; }

  /* ---- 响应式 ---- */
  @media (max-width: 520px) {
    .name { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<!-- 开场动画 -->
<div class="splash-screen" id="splashScreen">
  <div class="splash-skull">💀</div>
  <div class="splash-welcome">欢迎光临</div>
  <div class="splash-text">OSC</div>
</div>

<div class="container">

  <!-- 名字 -->
  <div class="name">OSC</div>

  <!-- 链接卡片 -->
  <div class="link-grid">
    <a class="link-card" href="https://shimail.cn" target="_blank">
      <div class="link-card-title">个人博客</div>
      <div class="link-card-url">shimail.cn</div>
    </a>
    <a class="link-card" href="https://wangshipeng.com" target="_blank">
      <div class="link-card-title">其他项目</div>
      <div class="link-card-url">wangshipeng.com</div>
    </a>
  </div>

</div>

<footer>
  <div class="badges">
    <a href="https://github.com" target="_blank"><img src="https://img.shields.io/badge/GitHub-OSC-black?logo=github" alt="GitHub"></a>
    <img src="https://img.shields.io/badge/DNS-ENAME-red?logo=nextdns" alt="DNS-ENAME">
    <img src="https://img.shields.io/badge/DOMIAN-GNAME-brown?logo=webex" alt="DOMIAN-GNAME">
    <img src="https://img.shields.io/badge/AI-DeepSeek-blue?logo=deepseek" alt="AI-DeepSeek">
  </div>
  <div>本站已运行：<span id="runtime">--</span></div>
  <div>旅行者1号距地球：<span id="voyager">--</span> 亿公里</div>
  <div>当前时间：<span id="clock">--</span></div>
  <div>© 2026 <a href="https://www.wangshipeng.com" target="_blank">WSP</a> · All Rights Reserved</div>
</footer>

<script>
  /* 开场动画 - 1.5秒后自动消失，不可跳过 */
  var splashDismissed = false;
  function dismissSplash() {
    if (splashDismissed) return;
    splashDismissed = true;
    var splash = document.getElementById('splashScreen');
    splash.classList.add('fade-out');
    setTimeout(function() {
      splash.style.display = 'none';
    }, 800);
  }
  setTimeout(dismissSplash, 1500);

  /* 实时时钟 */
  function tick() {
    var now = new Date();
    var pad = function(n) { return String(n).padStart(2, '0'); };
    document.getElementById('clock').textContent =
      now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' +
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  }
  tick();
  setInterval(tick, 1000);

  /* 运行时间 - 从 2022-10-01 10:10:00 起 */
  function updateRuntime() {
    var start = new Date('2022-10-01T10:10:00');
    var now = new Date();
    var diff = Math.floor((now - start) / 1000);
    var secs = diff % 60;
    var mins = Math.floor(diff / 60) % 60;
    var hours = Math.floor(diff / 3600) % 24;
    var days = Math.floor(diff / 86400);
    var pad = function(n) { return String(n).padStart(2, '0'); };
    document.getElementById('runtime').textContent =
      days + ' 天 ' + pad(hours) + ':' + pad(mins) + ':' + pad(secs);
  }
  updateRuntime();
  setInterval(updateRuntime, 1000);

  /* 旅行者1号距离 - 参考: 2026-02-23 约257亿公里, 速度约17km/s */
  function updateVoyager() {
    var refDate = new Date('2026-02-23T00:00:00');
    var now = new Date();
    var diffSec = (now - refDate) / 1000;
    var refDist = 25700000000;
    var speed = 17;
    var dist = refDist + speed * diffSec;
    var distYi = (dist / 100000000).toFixed(2);
    document.getElementById('voyager').textContent = distYi;
  }
  updateVoyager();
  setInterval(updateVoyager, 1000);
</script>

</body>
</html>
