<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    color: #2c4a3e;
    font-family: "Noto Serif SC", "Source Han Serif CN", "STSong", serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    max-width: 680px;
    width: 100%;
    padding: 60px 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  /* ---- 名字区域 ---- */
  .name {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 36px;
  }

  /* ---- 四栏信息 ---- */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    width: 100%;
    margin-bottom: 36px;
    text-align: center;
  }
  .info-item {
    padding: 10px 6px;
    border: 1px solid #b7c9be;
    border-radius: 8px;
    transition: background .2s;
    cursor: default;
  }
  .info-item:hover { background: #f2f7f4; }
  .info-item a {
    color: #2c4a3e;
    text-decoration: none;
  }
  .info-item a:hover { text-decoration: underline; }
  .info-label {
    font-size: 0.72rem;
    opacity: 0.55;
    margin-bottom: 6px;
    letter-spacing: 0.08em;
  }
  .info-value {
    font-size: 0.88rem;
    font-weight: 500;
    word-break: break-all;
  }

  /* ---- 分隔线 ---- */
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #b7c9be, transparent);
    margin: 8px 0 40px;
  }

  /* ---- 诗词区域 ---- */
  .poem-section {
    text-align: center;
    margin-bottom: 44px;
    line-height: 2;
  }
  .poem-title {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }
  .poem-body {
    font-size: 0.95rem;
    line-height: 2.1;
    letter-spacing: 0.06em;
  }

  /* ---- 底部 ---- */
  footer {
    width: 100%;
    text-align: center;
    padding: 28px 16px 32px;
    border-top: 1px solid #dde7e0;
    font-size: 0.78rem;
    opacity: 0.5;
    letter-spacing: 0.04em;
    line-height: 1.8;
  }
  #clock { font-variant-numeric: tabular-nums; }

  /* ---- 响应式 ---- */
  @media (max-width: 520px) {
    .info-grid { grid-template-columns: repeat(2, 1fr); }
    .name { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- 名字 -->
  <div class="name">王世朋</div>

  <!-- 信息栏 -->
  <div class="info-grid">
    <div class="info-item">
      <div class="info-label">个人博客</div>
      <div class="info-value"><a href="https://www.shimail.cn" target="_blank">前往博客 →</a></div>
    </div>
    <div class="info-item">
      <div class="info-label">其他项目</div>
      <div class="info-value"><a href="https://www.wangshipeng.com" target="_blank">查看项目 →</a></div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- 毛泽东诗词 -->
  <div class="poem-section">
    <div class="poem-title">浪淘沙 · 北戴河</div>
    <div class="poem-body">
      大雨落幽燕，白浪滔天，秦皇岛外打鱼船。<br>
      一片汪洋都不见，知向谁边？<br><br>
      往事越千年，魏武挥鞭，东临碣石有遗篇。<br>
      萧瑟秋风今又是，换了人间。
    </div>
  </div>

  <!-- 署名 -->
  <div style="text-align:right; margin-bottom:48px; font-size:1rem; letter-spacing:0.1em; opacity:0.7; width:100%; max-width:560px;">
    —— 毛泽东
  </div>

</div>

<footer>
  <div>当前时间：<span id="clock">--</span></div>
  <div>© 2026 WSP · All Rights Reserved</div>
</footer>

<script>
  /* 实时时钟 */
  function tick() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    document.getElementById('clock').textContent =
      `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ` +
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
