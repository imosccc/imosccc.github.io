<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    color: #2c4a3e;
    font-family: "Noto Serif SC", "Source Han Serif CN", "STSong", serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    max-width: 680px;
    width: 100%;
    padding: 60px 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  .name {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 36px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 48px;
    text-align: center;
  }
  .info-item {
    padding: 14px 8px;
    border: 1px solid #b7c9be;
    border-radius: 8px;
    transition: background .2s;
    cursor: default;
  }
  .info-item:hover { background: #f2f7f4; }
  .info-item a {
    color: #2c4a3e;
    text-decoration: none;
  }
  .info-item a:hover { text-decoration: underline; }
  .info-label {
    font-size: 0.72rem;
    opacity: 0.55;
    margin-bottom: 6px;
    letter-spacing: 0.08em;
  }
  .info-value {
    font-size: 0.88rem;
    font-weight: 500;
  }

  footer {
    width: 100%;
    text-align: center;
    padding: 28px 16px 20px;
    border-top: 1px solid #dde7e0;
    font-size: 0.78rem;
    opacity: 0.6;
    letter-spacing: 0.04em;
    line-height: 2.2;
  }
  #clock { font-variant-numeric: tabular-nums; }
  
  .github-badge {
    margin-bottom: 12px;
  }
  .github-badge img {
    height: 20px;
    vertical-align: middle;
  }

  @media (max-width: 520px) {
    .info-grid { grid-template-columns: 1fr; max-width: 280px; }
    .name { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="name">你的名字</div>

  <div class="info-grid">
    <div class="info-item">
      <div class="info-label">个人博客</div>
      <div class="info-value">
        <a href="https://www.shimail.cn" target="_blank">前往博客 →</a>
      </div>
    </div>
    <div class="info-item">
      <div class="info-label">其他项目</div>
      <div class="info-value">
        <a href="https://www.wangshipeng.com" target="_blank">查看项目 →</a>
      </div>
    </div>
  </div>

</div>

<footer>
  <div class="github-badge">
    <a href="https://github.com" target="_blank">
      <img src="https://img.shields.io/badge/Source-Github-blue?logo=github" alt="Source-Github">
    </a>
  </div>
  <div>本站已运行 <span id="runtime">0年 0天 0时 0分 0秒</span></div>
  <div>旅行者 1 号当前距离地球 <span id="voyager-distance">--</span> 千米，约为 <span id="voyager-au">--</span> 个天文单位（信号单程需 <span id="voyager-signal">--</span>）</div>
  <div>当前时间：<span id="clock">--</span></div>
  <div>© 2026 你的名字 · All Rights Reserved</div>
</footer>

<script>
  function tick() {
    try {
      var now = new Date();
      var pad = function(n) { return String(n).padStart(2, '0'); };
      var clockEl = document.getElementById('clock');
      if (clockEl) {
        clockEl.textContent =
          now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' +
          pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      }
      
      var start = new Date(2022, 9, 1, 10, 10, 0);
      var years = now.getFullYear() - start.getFullYear();
      var months = now.getMonth() - start.getMonth();
      var days = now.getDate() - start.getDate();
      var hours = now.getHours() - start.getHours();
      var mins = now.getMinutes() - start.getMinutes();
      var secs = now.getSeconds() - start.getSeconds();
      
      if (secs < 0) { secs += 60; mins--; }
      if (mins < 0) { mins += 60; hours--; }
      if (hours < 0) { hours += 24; days--; }
      if (days < 0) {
        var prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
        days += prevMonth.getDate();
        months--;
      }
      if (months < 0) { months += 12; years--; }
      
      var runtimeEl = document.getElementById('runtime');
      if (runtimeEl) {
        runtimeEl.textContent = years + '年 ' + pad(days) + '天 ' + pad(hours) + '时 ' + pad(mins) + '分 ' + pad(secs) + '秒';
      }
    } catch(e) { console.error('Clock error:', e); }
  }
  
  function updateVoyager() {
    try {
      var referenceDate = new Date(2026, 1, 23, 0, 0, 0);
      var referenceDistance = 25700000000;
      var speed = 17.0;
      
      var now = new Date();
      var elapsedSeconds = (now - referenceDate) / 1000;
      var currentDistance = referenceDistance + (elapsedSeconds * speed);
      
      var au = currentDistance / 149597870.7;
      
      var lightSpeed = 299792.458;
      var signalSeconds = currentDistance / lightSpeed;
      var signalHours = Math.floor(signalSeconds / 3600);
      var signalMinutes = Math.floor((signalSeconds % 3600) / 60);
      
      var distanceFormatted = Math.round(currentDistance).toLocaleString();
      
      var distEl = document.getElementById('voyager-distance');
      var auEl = document.getElementById('voyager-au');
      var signalEl = document.getElementById('voyager-signal');
      
      if (distEl) distEl.textContent = distanceFormatted;
      if (auEl) auEl.textContent = au.toFixed(6);
      if (signalEl) signalEl.textContent = signalHours + ' 小时 ' + signalMinutes + ' 分';
    } catch(e) { console.error('Voyager error:', e); }
  }
  
  tick();
  updateVoyager();
  setInterval(tick, 1000);
  setInterval(updateVoyager, 1000);
</script>

</body>
</html>
