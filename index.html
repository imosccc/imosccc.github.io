<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #ffffff;
    color: #2c4a3e;
    font-family: "Noto Serif SC", "Source Han Serif CN", "STSong", serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    max-width: 680px;
    width: 100%;
    padding: 60px 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
  }

  .name {
    font-size: 2.4rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-bottom: 36px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 400px;
    margin-bottom: 48px;
    text-align: center;
  }
  .info-item {
    padding: 14px 8px;
    border: 1px solid #b7c9be;
    border-radius: 8px;
    transition: background .2s;
    cursor: default;
  }
  .info-item:hover { background: #f2f7f4; }
  .info-item a {
    color: #2c4a3e;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .info-item a:hover { text-decoration: underline; }
  .info-label {
    font-size: 0.72rem;
    opacity: 0.55;
    margin-bottom: 6px;
    letter-spacing: 0.08em;
  }
  .info-value {
    font-size: 0.88rem;
    font-weight: 500;
  }

  .poem-section {
    text-align: center;
    margin-bottom: 44px;
    line-height: 2;
  }
  .poem-title {
    font-size: 1.15rem;
    font-weight: 600;
    margin-bottom: 12px;
    letter-spacing: 0.1em;
  }
  .poem-body {
    font-size: 0.95rem;
    line-height: 2.1;
    letter-spacing: 0.06em;
  }

  .signature {
    text-align: right;
    width: 100%;
    max-width: 560px;
    font-size: 1rem;
    letter-spacing: 0.1em;
    opacity: 0.7;
    margin-bottom: 48px;
  }

  .badges {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 24px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 16px;
    background: #f2f7f4;
    border: 1px solid #b7c9be;
    border-radius: 20px;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    min-width: 180px;
    justify-content: center;
  }
  .badge-icon {
    font-size: 0.9rem;
  }
  .badge-runtime {
    color: #2c4a3e;
    font-weight: 600;
  }
  .badge-status {
    font-weight: 600;
  }
  .status-work {
    color: #e67e22;
  }
  .status-free {
    color: #27ae60;
  }
  .status-sleep {
    color: #8e44ad;
  }

  footer {
    width: 100%;
    text-align: center;
    padding: 28px 16px 32px;
    border-top: 1px solid #dde7e0;
    font-size: 0.78rem;
    opacity: 0.5;
    letter-spacing: 0.04em;
    line-height: 1.8;
  }
  #clock { font-variant-numeric: tabular-nums; }

  @media (max-width: 520px) {
    .info-grid { grid-template-columns: 1fr; max-width: 280px; }
    .name { font-size: 1.8rem; }
  }
</style>
</head>
<body>

<div class="container">

  <div class="name">你的名字</div>

  <div class="info-grid">
    <div class="info-item">
      <div class="info-label">个人博客</div>
      <div class="info-value">
        <a href="https://www.shimail.cn" target="_blank">
          <span>📝</span>
          <span>前往博客 →</span>
        </a>
      </div>
    </div>
    <div class="info-item">
      <div class="info-label">其他项目</div>
      <div class="info-value">
        <a href="https://www.wangshipeng.com" target="_blank">
          <span>💻</span>
          <span>查看项目 →</span>
        </a>
      </div>
    </div>
  </div>

  <div class="poem-section">
    <div class="poem-title">浪淘沙 · 北戴河</div>
    <div class="poem-body">
      大雨落幽燕，白浪滔天，秦皇岛外打鱼船。<br>
      一片汪洋都不见，知向谁边？<br><br>
      往事越千年，魏武挥鞭，东临碣石有遗篇。<br>
      萧瑟秋风今又是，换了人间。
    </div>
  </div>

  <div class="signature">—— 毛泽东</div>

  <div class="badges">
    <div class="badge">
      <span class="badge-icon">⏱️</span>
      <span class="badge-runtime">运行: <span id="runtime">0年 0月 0日 0时 0分 0秒</span></span>
    </div>
    <div class="badge">
      <span class="badge-icon" id="status-icon">🌙</span>
      <span class="badge-status" id="status-text">睡觉休眠中</span>
    </div>
  </div>

</div>

<footer>
  <div>当前时间：<span id="clock">--</span></div>
  <div>© 2026 你的名字 · All Rights Reserved</div>
</footer>

<script>
  function tick() {
    var now = new Date();
    var pad = function(n) { return String(n).padStart(2, '0'); };
    document.getElementById('clock').textContent =
      now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate()) + ' ' +
      pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
    
    var start = new Date(2020, 0, 1, 0, 0, 0);
    var years = now.getFullYear() - start.getFullYear();
    var months = now.getMonth() - start.getMonth();
    var days = now.getDate() - start.getDate();
    var hours = now.getHours() - start.getHours();
    var mins = now.getMinutes() - start.getMinutes();
    var secs = now.getSeconds() - start.getSeconds();
    
    if (secs < 0) { secs += 60; mins--; }
    if (mins < 0) { mins += 60; hours--; }
    if (hours < 0) { hours += 24; days--; }
    if (days < 0) {
      var prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
      days += prevMonth.getDate();
      months--;
    }
    if (months < 0) { months += 12; years--; }
    
    document.getElementById('runtime').textContent = 
      years + '年 ' + months + '月 ' + days + '日 ' + hours + '时 ' + mins + '分 ' + secs + '秒';
    
    var hour = now.getHours();
    var statusIcon = document.getElementById('status-icon');
    var statusText = document.getElementById('status-text');
    statusText.className = 'badge-status';
    
    if (hour >= 8 && hour < 18) {
      statusIcon.textContent = '💼';
      statusText.textContent = '上班摸鱼中';
      statusText.classList.add('status-work');
    } else if (hour >= 18 && hour < 24) {
      statusIcon.textContent = '🛋️';
      statusText.textContent = '自由活动中';
      statusText.classList.add('status-free');
    } else {
      statusIcon.textContent = '🌙';
      statusText.textContent = '睡觉休眠中';
      statusText.classList.add('status-sleep');
    }
  }
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
